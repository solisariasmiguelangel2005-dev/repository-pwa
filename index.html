<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect - Red Social</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Librería idb (basada en Promesas) -->
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>

    <!-- Tu archivo de base de datos local -->
    <script src="js/db.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#2563eb">

    <link rel="apple-touch-icon" href="images/icon-192x192.png">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-code"></i> DevConnect</h1>
        <button id="btn-sync" class="hover:text-blue-200">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-24">

        <!-- Aquí se dibujan los posts guardados en IndexedDB -->
        <div id="feed"></div>

    </main>

    <button id="btn-nuevo-post" class="fixed bottom-20 right-4 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg text-2xl flex items-center justify-center hover:bg-blue-700 transition">
        <i class="fa-solid fa-pen"></i>
    </button>

    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full flex justify-around p-3 text-gray-500 pb-safe z-10">
        <a href="#" class="flex flex-col items-center text-blue-600">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[10px]">Inicio</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600 transition">
            <i class="fa-solid fa-magnifying-glass text-xl mb-1"></i>
            <span class="text-[10px]">Buscar</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600 transition">
            <i class="fa-regular fa-bell text-xl mb-1"></i>
            <span class="text-[10px]">Avisos</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600 transition">
            <i class="fa-regular fa-user text-xl mb-1"></i>
            <span class="text-[10px]">Perfil</span>
        </a>
    </nav>

    <!-- Modal para nuevo post -->
    <div id="modal-post" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <form id="form-post" class="bg-white rounded-lg shadow-lg w-full max-w-md p-4 space-y-3">
            <h2 class="text-lg font-bold">Nuevo post</h2>
            <input type="text" id="autor" placeholder="Tu nombre" required
                   class="w-full border rounded p-2">
            <textarea id="contenido" placeholder="¿Qué quieres compartir?" required rows="4"
                      class="w-full border rounded p-2"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" id="btn-cancelar" class="px-4 py-2 text-gray-600">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Guardar</button>
            </div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
